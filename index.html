    <script>

                devBack: "← 返回首页",
                setPageTitle: "设置",

                workSrc: "原始Lua代码",
                workOut: "混淆输出",
                workPlaceholder: "粘贴Lua源码，或者上传.lua文件",
                labUpload: "📂 上传Lua文件",

                tipText: "⚙️ 字符串→查表 · 数字→算术式 · 压缩→移除注释",
                msgCopyOk: "✅ 复制成功！",
                msgCopyFail: "❌ 复制失败",

                optNumLen: "数字长度",

        };

        // ================================================================
        //  2.  ЯДРО ОБФУСКАТОРА (JavaScript-порт Python-версии)
        // ================================================================

        // ---------- 2.1 Конфигурация ----------
        const DIGITS = "0123456789";
        const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const LOWER = "abcdefghijklmnopqrstuvwxyz";
        const SPECIAL = (() => {
            let s = [];
            for (let i = 32; i < 127; i++) {
                const ch = String.fromCharCode(i);
                if (!DIGITS.includes(ch) && !UPPER.includes(ch) && !LOWER.includes(ch)) {
                    s.push(ch);
                }
            }
            return s.join('');
        })();
        const MAX_NUMBER = 10000000000;
        const VAR_NAME_LEN = 1000;

        // ---------- 2.2 Вспомогательные ----------
        function randomVarName() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let name = chars[Math.floor(Math.random() * 52)];
            for (let i = 1; i < VAR_NAME_LEN; i++) {
                name += chars[Math.floor(Math.random() * chars.length)];
            }
            return name;
        }

        function charGroupAndIndex(ch) {
            if (DIGITS.includes(ch)) return ['digits', DIGITS.indexOf(ch) + 1];
            if (UPPER.includes(ch)) return ['upper', UPPER.indexOf(ch) + 1];
            if (LOWER.includes(ch)) return ['lower', LOWER.indexOf(ch) + 1];
            if (SPECIAL.includes(ch)) return ['special', SPECIAL.indexOf(ch) + 1];
            return [null, null];
        }

        // ---------- 2.3 Генерация таблицы символов ----------
        function generateTableDef() {
            const rootVar = randomVarName();
            const depth = Math.floor(Math.random() * 100) + 1; // 1..100
            const levelKeys = [];
            for (let i = 0; i < depth; i++) {
                levelKeys.push(randomVarName());
            }
            const tableKeys = {
                digits: randomVarName(),
                upper: randomVarName(),
                lower: randomVarName(),
                special: randomVarName()
            };

            function buildCharTable(chars) {
                const items = chars.split('').map(c => `string.char(${c.charCodeAt(0)})`).join(', ');
                return `{ ${items} }`;
            }
            const tables = {
                digits: buildCharTable(DIGITS),
                upper: buildCharTable(UPPER),
                lower: buildCharTable(LOWER),
                special: buildCharTable(SPECIAL)
            };

            function buildNested(levelIdx) {
                if (levelIdx === depth) {
                    const inner = Object.keys(tableKeys).map(k =>
                        `${tableKeys[k]} = ${tables[k]}`
                    ).join(', ');
                    return `{ ${inner} }`;
                } else {
                    return `{ ${levelKeys[levelIdx]} = ${buildNested(levelIdx + 1)} }`;
                }
            }

            let fullTable;
            if (depth === 0) {
                fullTable = '{}';
            } else {
                fullTable = `{ ${levelKeys[0]} = ${buildNested(1)} }`;
            }
            const tableDef = `local ${rootVar} = ${fullTable}`;
            return { rootVar, levelKeys, tableKeys, tableDef };
        }

        // ---------- 2.4 Обработка Lua-экранирования ----------
        function unescapeLuaString(s) {
            const result = [];
            let i = 0;
            const n = s.length;
            while (i < n) {
                if (s[i] === '\\') {
                    if (i + 1 >= n) { result.push('\\'); break; }
                    const esc = s[i + 1];
                    i += 2;
                    switch (esc) {
                        case 'a':
                            result.push('\x07');
                            break;
                        case 'b':
                            result.push('\x08');
                            break;
                        case 'f':
                            result.push('\x0C');
                            break;
                        case 'n':
                            result.push('\x0A');
                            break;
                        case 'r':
                            result.push('\x0D');
                            break;
                        case 't':
                            result.push('\x09');
                            break;
                        case 'v':
                            result.push('\x0B');
                            break;
                        case '\\':
                            result.push('\\');
                            break;
                        case '"':
                            result.push('"');
                            break;
                        case "'":
                            result.push("'");
                            break;
                        default:
                            if (esc >= '0' && esc <= '9') {
                                let j = i;
                                while (j < n && s[j] >= '0' && s[j] <= '9' && (j - i) < 3) j++;
                                const num = parseInt(s.slice(i, j));
                                i = j;
                                if (num >= 0 && num <= 255) {
                                    result.push(String.fromCharCode(num));
                                } else {
                                    result.push('?' + num);
                                }
                            } else {
                                result.push('\\' + esc);
                            }
                    }
                } else {
                    result.push(s[i]);
                    i++;
                }
            }
            return result.join('');
        }

        // ---------- 2.5 Обефусцирование строки ----------
        function obfuscateString(content, rootVar, levelKeys, tableKeys, raw) {
            if (!content) return "''";
            let str = content;
            if (!raw) {
                str = unescapeLuaString(str);
            }
            const parts = [];
            for (const ch of str) {
                const code = ch.charCodeAt(0);
                if (code >= 32 && code <= 126 && ch !== '\\') {
                    const [group, idx] = charGroupAndIndex(ch);
                    if (group !== null) {
                        const path = [rootVar, ...levelKeys, tableKeys[group]].join('.');
                        parts.push(`${path}[${idx}]`);
                        continue;
                    }
                }
                // не-ASCII или недоступный символ → UTF-8 байты
                const encoder = new TextEncoder();
                const bytes = encoder.encode(ch);
                const byteExprs = [];
                for (const b of bytes) {
                    byteExprs.push(`string.char(${b})`);
                }
                parts.push(byteExprs.join(' .. '));
            }
            return parts.join(' .. ');
        }

        // ---------- 2.6 Обефусцирование чисел ----------
        function generateNumberExpression(n, length, maxNum) {
            if (length < 1) length = 1;
            for (let attempt = 0; attempt < 200; attempt++) {
                const ops = [];
                for (let i = 0; i < length; i++) {
                    ops.push(Math.random() < 0.5 ? '+' : '-');
                }
                const nums = [];
                for (let i = 0; i < length; i++) {
                    nums.push(Math.floor(Math.random() * (maxNum + 1)));
                }
                let E = nums[0];
                for (let i = 0; i < length - 1; i++) {
                    E = (ops[i] === '+') ? E + nums[i + 1] : E - nums[i + 1];
                }
                const opLast = ops[ops.length - 1];
                let x;
                if (opLast === '+') {
                    x = n - E;
                } else {
                    x = E - n;
                }
                if (x >= 0 && x <= maxNum) {
                    const parts = [String(nums[0])];
                    for (let i = 0; i < length - 1; i++) {
                        parts.push(ops[i]);
                        parts.push(String(nums[i + 1]));
                    }
                    parts.push(opLast);
                    parts.push(String(x));
                    return parts.join(' ');
                }
            }
            // fallback
            const a = Math.floor(Math.random() * (n + 1));
            return `${a} + ${n - a}`;
        }

        function obfuscateNumber(nStr, length, maxNum) {
            const n = parseInt(nStr, 10);
            if (isNaN(n)) return nStr;
            const absN = Math.abs(n);
            const expr = generateNumberExpression(absN, length, maxNum);
            return n < 0 ? `-(${expr})` : `(${expr})`;
        }

        // ---------- 2.7 Сжатие кода ----------
        function compressCode(code) {
            // Защита строковых литералов
            const placeholders = {};
            let counter = 0;

            function protect(match) {
                const ph = `__PH_${counter}__`;
                counter++;
                placeholders[ph] = match;
                return ph;
            }

            // Строки в кавычках
            let protectedCode = code.replace(/(["'])((?:(?!\1|\\).|\\.)*)\1/gs, protect);
            // Блочные комментарии --[[ ... ]]
            protectedCode = protectedCode.replace(/--\[\[.*?\]\]/gs, protect);
            // Строчные комментарии -- ...
            protectedCode = protectedCode.replace(/--[^\n]*/g, '');
            // Сжимаем пробелы
            let compressed = protectedCode.replace(/\s+/g, ' ').trim();
            // Восстанавливаем защищенные фрагменты
            for (const [ph, original] of Object.entries(placeholders)) {
                compressed = compressed.replace(ph, original);
            }
            return compressed;
        }

        // ---------- 2.8 Главная функция обфускации ----------
        function obfuscateLuaSource(src, enableString, enableNumber, numLength, enableCompress) {
            let code = src;

            // ---- Строки ----
            if (enableString) {
                const { rootVar, levelKeys, tableKeys, tableDef } = generateTableDef();

                // Длинные строки [[...]] или [=[...]=]
                const longStringRe = /\[(=*)\[(.*?)\]\1\]/gs;
                code = code.replace(longStringRe, (match, eq, content) => {
                    return obfuscateString(content, rootVar, levelKeys, tableKeys, true);
                });

                // Короткие строки '...' и "..."
                const shortStringRe = /(["'])((?:(?!\1|\\).|\\.)*)\1/gs;
                code = code.replace(shortStringRe, (match, quote, content) => {
                    return obfuscateString(content, rootVar, levelKeys, tableKeys, false);
                });

                // Вставляем определение таблицы
                const lines = code.split(/\r?\n/);
                if (lines.length > 0 && lines[0].startsWith('#!')) {
                    lines.splice(1, 0, tableDef + '\n');
                } else {
                    lines.unshift(tableDef + '\n');
                }
                code = lines.join('\n');
            }

            // ---- Числа ----
            if (enableNumber) {
                const numberRe = /\b\d+\b/g;
                code = code.replace(numberRe, (match) => {
                    return obfuscateNumber(match, numLength, MAX_NUMBER);
                });
            }

            // ---- Сжатие ----
            if (enableCompress) {
                code = compressCode(code);
            }

            return code;
        }

        // ================================================================
        //  3.  ИНТЕГРАЦИЯ С UI
        // ================================================================

        let currentLang = "ru";

        // DOM-ссылки
        const startHome = document.getElementById('startHome');
        const devPage = document.getElementById('devPage');
        const settingPage = document.getElementById('settingPage');
        const workspace = document.getElementById('workspace');
        const srcLua = document.getElementById('srcLua');
        const outLua = document.getElementById('outLua');
        const selLang = document.getElementById('selLang');
        const tipText = document.getElementById('tipText');

        // Опции
        const optString = document.getElementById('optString');
        const optNumber = document.getElementById('optNumber');
        const optCompress = document.getElementById('optCompress');
        const optDepth = document.getElementById('optDepth');
        const optNumLen = document.getElementById('optNumLen');

        // ---------- 3.1 Загрузка/сохранение настроек ----------
        function loadSettings() {
            const savedLang = localStorage.getItem('luaobf_lang') || 'ru';
            currentLang = savedLang;
            selLang.value = savedLang;
            // опции
            try {
                const s = JSON.parse(localStorage.getItem('luaobf_opts') || '{}');
                optString.checked = s.optString !== undefined ? s.optString : true;
                optNumber.checked = s.optNumber !== undefined ? s.optNumber : true;
                optCompress.checked = s.optCompress || false;
                optDepth.value = s.optDepth || 100;
                optNumLen.value = s.optNumLen || 1;
            } catch (e) { /* ignore */ }
        }

        function saveSettings() {
            localStorage.setItem('luaobf_lang', currentLang);
            localStorage.setItem('luaobf_opts', JSON.stringify({
                optString: optString.checked,
                optNumber: optNumber.checked,
                optCompress: optCompress.checked,
                optDepth: parseInt(optDepth.value, 10) || 100,
                optNumLen: parseInt(optNumLen.value, 10) || 1
            }));
        }

        // ---------- 3.2 Применение языка ----------
        function applyLang(lang) {
            if (!locales[lang]) lang = 'ru';
            currentLang = lang;
            document.documentElement.lang = lang;
            document.title = 'GoreBox - ' + locales[lang].workPageTitle;

            document.getElementById('btnStart').textContent = locales[lang].homeStart;
            document.getElementById('btnDev').textContent = locales[lang].homeDev;
            document.getElementById('btnSetting').textContent = locales[lang].homeSet;
            document.getElementById('devTitle').textContent = locales[lang].devPageTitle;
            document.getElementById('btnBackDev').textContent = locales[lang].devBack;
            document.getElementById('setPageTitle').textContent = locales[lang].setPageTitle;
            document.getElementById('labelLang').textContent = locales[lang].setLangLabel;
            document.getElementById('btnSettingBack').textContent = locales[lang].devBack;
            document.getElementById('workTitle').textContent = locales[lang].workPageTitle;
            document.getElementById('srcLabel').textContent = locales[lang].workSrc;
            document.getElementById('outLabel').textContent = locales[lang].workOut;
            srcLua.placeholder = locales[lang].workPlaceholder;
            document.getElementById('labUpload').textContent = locales[lang].labUpload;
            document.getElementById('runBtnText').textContent = locales[lang].btnObf;
            document.getElementById('copyBtnText').textContent = locales[lang].btnCopy;
            document.getElementById('dlBtnText').textContent = locales[lang].btnDl;
            document.getElementById('clearBtnText').textContent = locales[lang].btnClear;
            document.getElementById('exitBtnText').textContent = locales[lang].btnExit;
            document.getElementById('optStringLabel').textContent = locales[lang].optString;
            document.getElementById('optNumberLabel').textContent = locales[lang].optNumber;
            document.getElementById('optCompressLabel').textContent = locales[lang].optCompress;
            document.getElementById('optDepthLabel').textContent = locales[lang].optDepth;
            document.getElementById('optNumLenLabel').textContent = locales[lang].optNumLen;
            tipText.textContent = locales[lang].tipText;
        }

        // ---------- 3.3 Навигация ----------
        document.getElementById('btnStart').onclick = () => {
            startHome.style.display = 'none';
            workspace.style.display = 'block';
        };
        document.getElementById('btnDev').onclick = () => {
            startHome.style.display = 'none';
            devPage.style.display = 'block';
        };
        document.getElementById('btnSetting').onclick = () => {
            startHome.style.display = 'none';
            settingPage.style.display = 'block';
        };
        document.getElementById('btnBackDev').onclick = () => {
            devPage.style.display = 'none';
            startHome.style.display = 'flex';
        };
        document.getElementById('btnSettingBack').onclick = () => {
            settingPage.style.display = 'none';
            startHome.style.display = 'flex';
        };
        document.getElementById('exitBtnText').onclick = () => {
            workspace.style.display = 'none';
            startHome.style.display = 'flex';
        };

        // ---------- 3.4 Язык ----------
        selLang.onchange = () => {
            currentLang = selLang.value;
            saveSettings();
            applyLang(currentLang);
        };

        // ---------- 3.5 Загрузка файла ----------
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                srcLua.value = ev.target.result;
                tipText.textContent = `📄 ${file.name} (${file.size} bytes)`;
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // ---------- 3.6 Копирование ----------
        function copyOutput() {
            const val = outLua.value;
            if (!val) {
                alert(locales[currentLang].msgNeedObf);
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                alert(locales[currentLang].msgCopyOk);
            }).catch(() => {
                alert(locales[currentLang].msgCopyFail);
            });
        }

        // ---------- 3.7 Скачивание ----------
        function downloadObf() {
            const content = outLua.value;
            if (!content) {
                alert(locales[currentLang].msgNeedObf);
                return;
            }
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'obfuscated.lua';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        // ---------- 3.8 Очистка ----------
        function clearAll() {
            srcLua.value = '';
            outLua.value = '';
            tipText.textContent = locales[currentLang].tipText;
        }

        // ---------- 3.9 ГЛАВНАЯ КНОПКА ОБФУСКАЦИИ ----------
        function luaObfuscate() {
            const src = srcLua.value;
            if (!src.trim()) {
                tipText.textContent = '⚠️ ' + locales[currentLang].workPlaceholder;
                return;
            }

            const enableString = optString.checked;
            const enableNumber = optNumber.checked;
            const enableCompress = optCompress.checked;
            const numLength = parseInt(optNumLen.value, 10) || 1;
            // depth используется внутри generateTableDef (случайная глубина от 1 до 100)
            // но пользователь может влиять через optDepth — используем как seed-параметр
            // В оригинале глубина случайна, но мы добавим детерминированность через seed
            // (не реализовано в полной мере, но оставим параметр для совместимости)

            try {
                const result = obfuscateLuaSource(src, enableString, enableNumber, numLength, enableCompress);
                outLua.value = result;
                tipText.textContent = '✅ ' + locales[currentLang].statusObfDone + '  |  ' + locales[currentLang].tipText;
                saveSettings();
            } catch (e) {
                tipText.textContent = locales[currentLang].statusError + e.message;
                console.error(e);
            }
        }

        // ---------- 3.10 Привязка кнопок ----------
        document.getElementById('runBtnText').onclick = luaObfuscate;
        document.getElementById('copyBtnText').onclick = copyOutput;
        document.getElementById('dlBtnText').onclick = downloadObf;
        document.getElementById('clearBtnText').onclick = clearAll;

        // ---------- 3.11 Сохранение опций при изменении ----------
        [optString, optNumber, optCompress, optDepth, optNumLen].forEach(el => {
            el.addEventListener('change', saveSettings);
            if (el.tagName === 'INPUT' && el.type === 'number') {
                el.addEventListener('input', saveSettings);
            }
        });

        // ---------- 3.12 Инициализация ----------
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            applyLang(currentLang);
            // Показываем подсказку
            tipText.textContent = locales[currentLang].tipText;
        });

        // ---------- 3.13 Защита от контекстного меню / копирования (кроме textarea) ----------
        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('copy', (e) => {
            if (e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                return false;
            }
        });

        // ---------- 3.14 Экспорт функций в глобальный скоуп (для onclick в HTML) ----------
        window.luaObfuscate = luaObfuscate;
        window.copyOutput = copyOutput;
        window.downloadObf = downloadObf;
        window.clearAll = clearAll;
    </script>
</body>
</html>
